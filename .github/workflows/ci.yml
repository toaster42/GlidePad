name: Android CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v5

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v5
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/main' && github.ref != 'refs/heads/master' }}

      - name: Grant Execute Permission for Gradlew
        run: chmod +x gradlew

      - name: Setup google-services.json
        run: |
          if [ ! -f app/google-services.json ]; then
            if [ -n "$GOOGLE_SERVICES_JSON" ]; then
              echo "$GOOGLE_SERVICES_JSON" > app/google-services.json
            else
              echo '{"project_info":{"project_number":"843892215261","project_id":"gen-lang-client-0572362862","storage_bucket":""},"client":[{"client_info":{"mobilesdk_app_id":"1:843892215261:android:d821bdc7d102acfe89ba34","android_client_info":{"package_name":"com.aistudio.glidepad.kxvtwm"}},"oauth_client":[],"api_key":[{"current_key":"dummy_ci_key"}],"services":{}}],"configuration_version":"1"}' > app/google-services.json
            fi
          fi
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}

      - name: Setup debug keystore
        run: |
          if [ ! -f debug.keystore ]; then
            if [ -f debug.keystore.base64 ]; then
              base64 -d debug.keystore.base64 > debug.keystore
            elif [ -n "$DEBUG_KEYSTORE_BASE64" ]; then
              echo "$DEBUG_KEYSTORE_BASE64" | base64 -d > debug.keystore
            else
              keytool -genkey -v -keystore debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
            fi
          fi
        env:
          DEBUG_KEYSTORE_BASE64: ${{ secrets.DEBUG_KEYSTORE_BASE64 }}

      - name: Run Unit & Robolectric Tests
        run: ./gradlew testDebugUnitTest --stacktrace

      - name: Validate Python Receiver Scripts Syntax
        run: python3 -m py_compile *.py

      - name: Run Python Receiver Network Integration Tests
        run: python3 test_receiver_integration.py

      - name: Assemble Debug APK
        run: ./gradlew assembleDebug

      - name: Upload Test Report Artifact
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: unit-test-report
          path: app/build/reports/tests/testDebugUnitTest/

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v6
        with:
          name: glidepad-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
