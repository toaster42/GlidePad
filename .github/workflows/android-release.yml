name: Build and Release Android APK

on:
  push:
    tags:
      - 'v*' # Triggers whenever you push a version tag like v1.0.0
  workflow_dispatch: # Allows manual triggering from the GitHub website

jobs:
  build:
    runs-on: ubuntu-latest

    permissions:
      contents: write # Grants permission to create GitHub Releases

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Make Gradle wrapper executable
        run: chmod +x gradlew

      - name: Setup google-services.json
        run: |
          if [ ! -f app/google-services.json ]; then
            if [ -n "$GOOGLE_SERVICES_JSON" ]; then
              echo "$GOOGLE_SERVICES_JSON" > app/google-services.json
            else
              echo '{"project_info":{"project_number":"843892215261","project_id":"gen-lang-client-0572362862","storage_bucket":""},"client":[{"client_info":{"mobilesdk_app_id":"1:843892215261:android:d821bdc7d102acfe89ba34","android_client_info":{"package_name":"com.aistudio.glidepad.kxvtwm"}},"oauth_client":[],"api_key":[{"current_key":"dummy_ci_key"}],"services":{}}],"configuration_version":"1"}' > app/google-services.json
            fi
          fi
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}

      - name: Build Debug APK
        run: ./gradlew assembleDebug

      - name: Upload APK to GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: app/build/outputs/apk/debug/app-debug.apk
          generate_release_notes: true
