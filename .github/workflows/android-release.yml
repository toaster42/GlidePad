name: Build and Release Android APK

on:
  push:
    tags:
      - 'v*' # Triggers whenever you push a version tag like v1.0.0
  workflow_dispatch: # Allows manual triggering from the GitHub website

jobs:
  build:
    runs-on: ubuntu-latest

    permissions:
      contents: write # Grants permission to create GitHub Releases

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Make Gradle wrapper executable
        run: chmod +x gradlew

      - name: Setup google-services.json
        run: |
          if [ ! -f app/google-services.json ]; then
            if [ -n "$GOOGLE_SERVICES_JSON" ]; then
              echo "$GOOGLE_SERVICES_JSON" > app/google-services.json
            else
              echo '{"project_info":{"project_number":"843892215261","project_id":"gen-lang-client-0572362862","storage_bucket":""},"client":[{"client_info":{"mobilesdk_app_id":"1:843892215261:android:d821bdc7d102acfe89ba34","android_client_info":{"package_name":"com.aistudio.glidepad.kxvtwm"}},"oauth_client":[],"api_key":[{"current_key":"dummy_ci_key"}],"services":{}}],"configuration_version":"1"}' > app/google-services.json
            fi
          fi
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}

      - name: Setup debug keystore
        run: |
          if [ ! -f debug.keystore ]; then
            if [ -f debug.keystore.base64 ]; then
              base64 -d debug.keystore.base64 > debug.keystore
            elif [ -n "$DEBUG_KEYSTORE_BASE64" ]; then
              echo "$DEBUG_KEYSTORE_BASE64" | base64 -d > debug.keystore
            else
              keytool -genkey -v -keystore debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
            fi
          fi
        env:
          DEBUG_KEYSTORE_BASE64: ${{ secrets.DEBUG_KEYSTORE_BASE64 }}

      - name: Setup release keystore
        run: |
          if [ ! -f my-upload-key.jks ] && [ ! -f app/my-upload-key.jks ]; then
            if [ -n "$KEYSTORE_BASE64" ]; then
              echo "$KEYSTORE_BASE64" | base64 -d > my-upload-key.jks
            else
              echo "Generating release keystore for CI..."
              keytool -genkey -v -keystore my-upload-key.jks -storepass "${STORE_PASSWORD:-android}" -alias "${KEY_ALIAS:-upload}" -keypass "${KEY_PASSWORD:-android}" -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=GlidePad Release,O=GlidePad,C=US"
            fi
          fi
          # Ensure keystore is present at both repository root and app/ directory for Gradle resolution
          if [ -f my-upload-key.jks ]; then
            cp my-upload-key.jks app/my-upload-key.jks
          fi
          if [ -f app/my-upload-key.jks ]; then
            cp app/my-upload-key.jks my-upload-key.jks
          fi
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD || 'android' }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD || 'android' }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS || 'upload' }}

      - name: Build Release APK
        run: ./gradlew assembleRelease
        env:
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD || 'android' }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD || 'android' }}
          KEYSTORE_PATH: ${{ github.workspace }}/my-upload-key.jks

      - name: Upload Release APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: glidepad-release-apk
          path: app/build/outputs/apk/release/app-release.apk

      - name: Upload APK to GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: app/build/outputs/apk/release/app-release.apk
          generate_release_notes: true
